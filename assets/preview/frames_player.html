var imgs = SRC.map(function(s){ var i = new Image(); i.src = s; return i; });
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var badge = document.getElementById('badge');
var order = [0,1,2,3], idx = 0, fps = 10, playing = true, ghost = false, guide = false;
var last = 0;

function draw(){
  var w = cv.width, h = cv.height, cell = 20, x, y;
  ctx.clearRect(0,0,w,h);
  for (y = 0; y < h; y += cell) {
    for (x = 0; x < w; x += cell) {
      ctx.fillStyle = ((x/cell + y/cell) % 2 === 0) ? '#eef0f4' : '#d6dae2';
      ctx.fillRect(x,y,cell,cell);
    }
  }
  if (ghost) {
    for (var k = 0; k < order.length; k++) {
      if (k === idx) continue;
      ctx.globalAlpha = 0.13;
      ctx.drawImage(imgs[order[k]],0,0,w,h);
    }
    ctx.globalAlpha = 1;
  }
  if (guide) {
    ctx.strokeStyle = 'rgba(255,80,80,.85)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, h*603/640); ctx.lineTo(w, h*603/640); ctx.stroke();
    ctx.strokeStyle = 'rgba(80,200,255,.7)';
    ctx.beginPath(); ctx.moveTo(w/2,0); ctx.lineTo(w/2,h); ctx.stroke();
  }
  ctx.drawImage(imgs[order[idx]],0,0,w,h);
  badge.textContent = 'F' + (order[idx]+1);
}

function tick(t){
  if (!last) last = t;
  if (playing && (t - last) >= 1000/fps) { idx = (idx+1) % 4; last = t; draw(); }
  if (playing) requestAnimationFrame(tick);
}

document.getElementById('fps').oninput = function(e){
  fps = +e.target.value;
  document.getElementById('fpsv').textContent = fps + ' fps';
  last = 0;
};
document.getElementById('zoom').oninput = function(e){
  var z = +e.target.value;
  document.getElementById('zoomv').textContent = z + '%';
  cv.width = Math.round(400*z/100);
  cv.height = Math.round(400*z/100);
  draw();
};
document.getElementById('play').onclick = function(e){
  playing = !playing;
  e.target.classList.toggle('on', playing);
  e.target.textContent = playing ? '暂停' : '播放';
  last = 0;
  if (playing) requestAnimationFrame(tick);
};
var btns = document.querySelectorAll('[data-order]');
Array.prototype.forEach.call(btns, function(b){
  b.onclick = function(){
    Array.prototype.forEach.call(btns, function(x){ x.classList.remove('on'); });
    b.classList.add('on');
    order = b.dataset.order.split('').map(function(n){ return +n - 1; });
    idx = 0; draw();
  };
});
document.getElementById('ghost').onclick = function(e){
  ghost = !ghost; e.target.classList.toggle('on', ghost); draw();
};
document.getElementById('guide').onclick = function(e){
  guide = !guide; e.target.classList.toggle('on', guide); draw();
};

var n = 0;
imgs.forEach(function(i){
  var done = function(){ n++; if (n === imgs.length) { draw(); requestAnimationFrame(tick); } };
  i.onload = done; i.onerror = done;
});
</script></body></html>
